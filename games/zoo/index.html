<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dierentuin</title>
</head>
<body>
<div id="app"></div>

<div id="ui" hidden>
  <div id="goals"></div>
  <button id="home" class="tool small"></button>
  <div id="wallet"></div>
  <div id="bubbles"></div>
  <div id="menu" hidden></div>
  <div id="speechbar">
    <button id="speech" hidden>
      <span class="who"><span class="portrait"></span><span class="name"></span></span>
      <span class="text"></span>
    </button>
  </div>
  <div id="bottom">
    <div id="options"></div>
    <div id="toolbar"></div>
  </div>
  <div id="overlay" hidden></div>
</div>

<div id="loading" hidden></div>

<div id="start">
  <h1 id="title"></h1>
  <div id="slots"></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
