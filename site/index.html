<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMJ Games</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #bfe6ff; font-family: system-ui, sans-serif; color: #3a2a1a; }
  main { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 48px 16px; }
  h1 { margin: 0; font-size: 40px; }
  a.game { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 220px; padding: 28px 16px;
           border-radius: 32px; background: #fff; box-shadow: 0 8px 0 #9cc7e6; text-decoration: none; color: inherit;
           font-weight: 800; font-size: 24px; }
  a.game span { font-size: 96px; line-height: 1; }
  a.game:active { transform: translateY(5px); box-shadow: 0 3px 0 #9cc7e6; }
</style>
</head>
<body>
<main>
  <h1>SMJ Games</h1>
  <a class="game" href="zoo/"><span>🦁</span>Dierentuin</a>
</main>
</body>
</html>
